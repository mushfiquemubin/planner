<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e2338">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Daily Planner - ICPC, Uni & Deen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F1F3F9; --card:#ffffff; --card-soft:#ffffffcc; --text:#10121C; --text-secondary:#666D82;
    --border:#E3E6F0; --accent:#2E5CF6; --accent-2:#0FBFBF; --accent-soft:rgba(46,92,246,0.08);
    --accent-glow:rgba(46,92,246,0.28);
    --green:#0EA968; --green-soft:rgba(14,169,104,0.1); --red:#E23B4E; --red-soft:rgba(226,59,78,0.09);
    --amber:#DB8B00; --amber-soft:rgba(219,139,0,0.1);
    --shadow:0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.06);
    --radius:16px; --sidebar-w:230px;
    --font-display:'Space Grotesk',-apple-system,sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  [data-theme="dark"]{
    --bg:#080A11; --card:#121623; --card-soft:#121623cc; --text:#EAECF6; --text-secondary:#8D93AB;
    --border:#212637; --accent:#5AA2FF; --accent-2:#2DE1D1; --accent-soft:rgba(108,147,255,0.14);
    --accent-glow:rgba(108,147,255,0.45);
    --green:#3DDB94; --green-soft:rgba(61,219,148,0.12); --red:#FF6B7D; --red-soft:rgba(255,107,125,0.1);
    --amber:#FFC24B; --amber-soft:rgba(255,194,75,0.12);
    --shadow:0 1px 3px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Inter',-apple-system,sans-serif; background:
      radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0) 0 0/22px 22px,
      var(--bg);
    color:var(--text);
    margin:0; transition:background-color .25s ease, color .25s ease;
  }
  [data-theme="dark"] body{ background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.045) 1px, transparent 0) 0 0/22px 22px,
      var(--bg); }
  h1,h2,h3,.section-title,.brand-name,.greeting,.nav-item{ font-family:var(--font-display); }
  .card{ transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease; }
  .card:hover{ box-shadow:0 2px 10px rgba(16,24,40,0.08), 0 1px 3px rgba(16,24,40,0.06); }
  button{ transition:background-color .15s ease, transform .1s ease, border-color .15s ease, color .15s ease; }
  button:active{ transform:scale(0.97); }
  input:focus-visible, select:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .layout{ display:flex; min-height:100vh; }

  /* SIDEBAR */
  #sidebar{
    width:var(--sidebar-w); background:var(--card); border-right:1px solid var(--border);
    padding:20px 14px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh;
    flex-shrink:0; transition:transform .25s ease; z-index:100;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:6px 10px 20px; }
  .brand-logo{ width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:15px; }
  .brand-name{ font-weight:700; font-size:15px; }
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px; cursor:pointer;
    color:var(--text-secondary); font-size:13.5px; font-weight:500; border:none; background:none; text-align:left; width:100%;
  }
  .nav-item:hover{ background:var(--accent-soft); color:var(--text); }
  .nav-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .nav-item svg{ width:18px; height:18px; flex-shrink:0; }
  .sidebar-footer{ margin-top:auto; padding-top:12px; border-top:1px solid var(--border); }
  #hamburger{ display:none; }

  /* MAIN */
  #main{ flex:1; min-width:0; padding:22px 24px 60px; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
  .greeting{ font-size:21px; font-weight:700; }
  .greeting-sub{ font-size:13px; color:var(--text-secondary); margin-top:2px; }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .clock-chip{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 12px; font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; box-shadow:var(--shadow); font-family:var(--font-mono); color:var(--accent); }
  .tasbeeh-circle,.timer-display{ font-family:var(--font-mono); }
  .stat-num{ font-family:var(--font-mono); font-size:22px; font-weight:700; margin-top:4px; }
  .icon-btn{ width:38px; height:38px; border-radius:10px; border:1px solid var(--border); background:var(--card); cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }
  .icon-btn svg{ width:18px; height:18px; }
  .qa-btn{ display:flex; align-items:center; gap:6px; background:var(--accent); color:#fff; border:none; padding:9px 14px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; }

  .section{ display:none; animation:fadeIn .25s ease; }
  .section.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:14px; box-shadow:var(--shadow); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:14px; }
  .grid3{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .section-title{ font-size:15.5px; font-weight:700; margin-bottom:12px; }
  .hint{ font-size:12px; color:var(--text-secondary); margin-top:8px; }
  .goal-edit-btn{ border:none; background:none; color:var(--accent); font-size:11.5px; font-weight:600; cursor:pointer; padding:2px 0; margin-top:2px; }
  .goal-edit-btn:hover{ text-decoration:underline; }
  .grade-calc{ margin-top:16px; padding-top:14px; border-top:1px dashed var(--border); }
  .grade-msg{ font-size:12.5px; font-weight:600; padding:8px 10px; border-radius:8px; margin-top:2px; }
  .grade-msg-green{ background:var(--green-soft); color:var(--green); }
  .grade-msg-amber{ background:var(--amber-soft); color:var(--amber); }
  .grade-msg-red{ background:var(--red-soft); color:var(--red); }

  /* progress ring */
  .ring-card{ display:flex; align-items:center; gap:14px; }
  .ring-label{ font-size:13px; font-weight:600; }
  .ring-sub{ font-size:11.5px; color:var(--text-secondary); }

  .btn-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .toggle-btn{ padding:9px 14px; border-radius:10px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-size:13px; color:var(--text); }
  .toggle-btn.on{ border-color:var(--green); color:var(--green); background:var(--green-soft); }
  .toggle-btn.sm{ padding:6px 10px; font-size:11.5px; }

  input[type=text],input[type=number],input[type=time],input[type=date],input[type=url],select{
    width:100%; padding:9px 11px; border-radius:10px; border:1px solid var(--border); background:var(--bg);
    color:var(--text); font-size:13.5px; margin-top:4px; font-family:inherit;
  }
  label.field-label{ font-size:12px; color:var(--text-secondary); display:block; margin-bottom:2px; font-weight:500; }
  button.primary{ background:var(--accent); color:#fff; border:none; padding:10px 16px; border-radius:10px; font-size:13.5px; font-weight:600; cursor:pointer; }
  button.ghost{ background:var(--bg); border:1px solid var(--border); color:var(--text); padding:10px 16px; border-radius:10px; font-size:13.5px; cursor:pointer; }
  button.danger-ghost{ background:var(--red-soft); border:1px solid transparent; color:var(--red); padding:6px 10px; border-radius:8px; font-size:11.5px; cursor:pointer; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  table{ width:100%; font-size:12.5px; border-collapse:collapse; margin-top:8px; }
  th{ text-align:left; color:var(--text-secondary); font-weight:600; padding:7px 4px; }
  td{ padding:7px 4px; border-top:1px solid var(--border); }

  .tag{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600; }
  .weekday-btns{ display:flex; gap:5px; flex-wrap:wrap; margin:6px 0; }
  .weekday-btn{ width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:11.5px; cursor:pointer; }
  .weekday-btn.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .slot-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--accent-soft); border-radius:20px; padding:4px 10px; font-size:11.5px; margin:3px 4px 3px 0; color:var(--accent); }
  .slot-chip button{ border:none; background:none; cursor:pointer; color:var(--accent); font-size:13px; }

  .course-card{ border:1px solid var(--border); border-radius:12px; padding:14px; margin-bottom:10px; background:var(--bg); }
  .course-card-header{ display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .course-card-body{ display:none; }
  .course-card-body.open{ display:block; }
  .course-chevron{ transition:transform 0.15s; display:inline-block; }
  .course-chevron.open{ transform:rotate(90deg); }
  .exam-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:10px; }
  .exam-box{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 10px; }
  .exam-box .lbl{ font-size:10.5px; color:var(--text-secondary); margin-bottom:4px; font-weight:600; }
  .material-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:5px 9px; font-size:11.5px; margin:3px 4px 0 0; }
  .material-chip a{ color:var(--accent); text-decoration:none; }
  .countdown-badge{ display:inline-block; background:var(--amber-soft); color:var(--amber); font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; margin-top:6px; }

  .todo-cat-tabs{ display:flex; gap:6px; margin-bottom:14px; }
  .todo-item{ display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--border); }
  .todo-item:first-child{ border-top:none; }
  .todo-item.done span.txt{ text-decoration:line-through; color:var(--text-secondary); }
  .todo-item input[type=checkbox]{ width:18px; height:18px; accent-color:var(--accent); }
  .todo-item span.txt{ flex:1; font-size:14px; }
  .prio-badge{ font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; }
  .prio-High{ background:var(--red-soft); color:var(--red); }
  .prio-Medium{ background:var(--amber-soft); color:var(--amber); }
  .prio-Low{ background:var(--green-soft); color:var(--green); }
  .due-chip{ font-size:10.5px; color:var(--text-secondary); }

  .timer-circle-wrap{ display:flex; justify-content:center; margin:8px 0; }
  .timer-display{ font-size:15px; font-weight:600; text-align:center; }
  .timer-time{ font-size:38px; font-weight:800; font-variant-numeric:tabular-nums; }
  .digital-lcd{
    font-family:var(--font-mono); font-size:44px; font-weight:700; letter-spacing:2px;
    color:var(--accent); text-shadow:0 0 18px var(--accent-glow);
  }
  .timer-controls{ display:flex; justify-content:center; gap:10px; margin:14px 0 6px; }
  .round-btn{ width:52px; height:52px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .round-btn.ghost{ background:var(--bg); border:1px solid var(--border); color:var(--text); width:44px; height:44px; }

  .badge{ display:inline-flex; align-items:center; gap:6px; background:var(--amber-soft); color:var(--amber); padding:6px 12px; border-radius:20px; font-size:12.5px; font-weight:600; margin:3px 4px 0 0; }

  .tasbeeh-circle{ width:150px; height:150px; border-radius:50%; background:var(--accent-soft); border:2px solid var(--accent); color:var(--accent); font-size:34px; font-weight:800; display:flex; align-items:center; justify-content:center; margin:10px auto; cursor:pointer; user-select:none; }

  .ayah-box{ background:linear-gradient(135deg, var(--accent-soft), transparent); border-radius:12px; padding:14px 16px; margin-bottom:14px; font-size:13.5px; line-height:1.6; border:1px solid var(--border); }

  /* CONFIRM MODAL */
  .modal-overlay{ position:fixed; inset:0; background:rgba(10,12,20,0.45); display:flex; align-items:center; justify-content:center; z-index:1000; padding:16px; }
  .modal-box{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; max-width:340px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,0.25); }
  .modal-msg{ font-size:13.5px; margin-bottom:16px; line-height:1.5; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; }

  /* CP PROBLEM LIST */
  .cp-item{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; border-top:1px solid var(--border); }
  .cp-item-main{ font-size:13px; }
  .cp-item-name{ font-weight:600; }
  .diff-tag{ font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; margin-left:6px; }
  .diff-Easy{ background:var(--green-soft); color:var(--green); }
  .diff-Medium{ background:var(--amber-soft); color:var(--amber); }
  .diff-Hard{ background:var(--red-soft); color:var(--red); }
  .cp-edit-row{ display:grid; grid-template-columns:1.3fr 1.3fr 0.8fr auto auto; gap:6px; align-items:center; padding:8px 0; border-top:1px solid var(--border); }
  .cp-edit-row input, .cp-edit-row select{ margin-top:0; }

  /* HEATMAP */
  .heatmap-wrap{ overflow-x:auto; padding-bottom:4px; }
  .heatmap-grid{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,12px); gap:3px; width:max-content; }
  .heatmap-cell{ width:12px; height:12px; border-radius:3px; background:var(--border); }
  .heatmap-legend{ display:flex; align-items:center; gap:4px; margin-top:8px; font-size:11px; color:var(--text-secondary); }

  /* ROUTINE MATRIX */
  .routine-table{ width:100%; border-collapse:collapse; font-size:11.5px; }
  .routine-table th{ background:var(--bg); padding:6px 4px; text-align:center; }
  .routine-table td{ border:1px solid var(--border); vertical-align:top; padding:3px; height:46px; }
  .routine-slot{ background:var(--accent-soft); color:var(--accent); border-radius:6px; padding:3px 5px; font-size:10.5px; font-weight:600; margin-bottom:2px; }

  /* GRADING COMPONENTS */
  .comp-row{ display:grid; grid-template-columns:1.4fr 0.8fr 0.8fr 0.8fr auto; gap:6px; align-items:center; margin-bottom:6px; }
  .comp-row input, .comp-row select{ margin-top:0; }
  .weight-warn{ font-size:11.5px; color:var(--amber); margin-top:4px; }

  @media (max-width: 860px){
    #sidebar{ position:fixed; left:0; top:0; transform:translateX(-100%); box-shadow:0 0 0 2000px rgba(0,0,0,0); }
    #sidebar.open{ transform:translateX(0); box-shadow:0 0 0 2000px rgba(0,0,0,0.35); }
    #hamburger{ display:flex; }
    #main{ padding:16px 14px 60px; }
    .row2{ grid-template-columns:1fr; }
  }
  /* ===== GLASS THEME v2 ===== */
  :root{ --glass:rgba(255,255,255,0.42); --glass-b:rgba(255,255,255,0.65); --blur:blur(22px) saturate(170%);
    --card:var(--glass); --bg:transparent; --border:rgba(255,255,255,0.7);
    --shadow:0 10px 30px rgba(40,56,120,0.14), inset 0 1px 0 rgba(255,255,255,0.9), inset 0 -1px 0 rgba(255,255,255,0.25); }
  [data-theme="dark"]{ --glass:rgba(255,255,255,0.06); --glass-b:rgba(255,255,255,0.14); --card:var(--glass); --bg:transparent;
    --border:rgba(255,255,255,0.14);
    --shadow:0 12px 34px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -1px 0 rgba(255,255,255,0.04); }
  html{ background:#e3eef8; } html[data-theme="dark"]{ background:#0f1826; color-scheme:dark; }
  body{ min-height:100vh; background:linear-gradient(135deg,#d8e6fb 0%,#e3eef8 50%,#d3eeee 100%) fixed !important; }
  [data-theme="dark"] body{ background:linear-gradient(160deg,#0f1826 0%,#17263c 55%,#12273b 100%) fixed !important; }
  .card, .clock-chip, .icon-btn, .modal-box, .toggle-btn{ -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); }
  .card{ border:1px solid var(--border); border-radius:22px; box-shadow:var(--shadow); }
  .card:hover{ border-color:var(--accent-glow); }

  /* floating rounded glass sidebar */
  #sidebar{
    position:sticky; top:14px; height:calc(100vh - 28px); margin:14px 0 14px 14px; padding:18px 12px;
    border-radius:28px; border:1px solid var(--border);
    background:linear-gradient(160deg,rgba(255,255,255,0.55),rgba(255,255,255,0.22));
    -webkit-backdrop-filter:blur(28px) saturate(180%); backdrop-filter:blur(28px) saturate(180%);
    box-shadow:0 18px 50px rgba(40,56,120,0.22), inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  [data-theme="dark"] #sidebar{
    background:linear-gradient(160deg,rgba(255,255,255,0.12),rgba(255,255,255,0.04));
    box-shadow:0 18px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.22), inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .brand{ padding:6px 10px 18px; }
  .brand-logo{ border-radius:13px; box-shadow:0 6px 16px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.5); }
  .nav-item{ border-radius:16px; padding:11px 14px; }
  .nav-item:hover{ background:var(--glass-b); }
  .nav-item.active{ background:var(--glass-b); color:var(--accent);
    box-shadow:0 4px 14px rgba(46,92,246,0.15), inset 0 1px 0 rgba(255,255,255,0.7); }
  .sidebar-footer{ border-top:1px solid var(--border); }

  input[type=text],input[type=number],input[type=time],input[type=date],input[type=url],select{ background:rgba(255,255,255,0.35); border:1px solid var(--border); border-radius:12px; }
  [data-theme="dark"] input[type=text],[data-theme="dark"] input[type=number],[data-theme="dark"] input[type=time],[data-theme="dark"] input[type=date],[data-theme="dark"] input[type=url],[data-theme="dark"] select{ background:rgba(255,255,255,0.07); }
  button.ghost,.weekday-btn{ background:rgba(255,255,255,0.3); border:1px solid var(--border); border-radius:12px; }
  button.primary,.qa-btn{ background:linear-gradient(135deg,var(--accent),var(--accent-2)); box-shadow:0 6px 18px var(--accent-glow); border-radius:12px; }
  @media (max-width:860px){
    #sidebar{ position:fixed; left:14px; top:14px; margin:0; height:calc(100% - 28px); transform:translateX(calc(-100% - 28px)); box-shadow:none; }
    #sidebar.open{ transform:translateX(0); box-shadow:0 18px 50px rgba(0,0,0,0.35), 0 0 0 2000px rgba(0,0,0,0.3); }
  }
  .modal-box{ background:#f4f7ff; color:var(--text); } [data-theme="dark"] .modal-box{ background:#13233a; }
  [data-theme="dark"] select option{ background:#13233a; color:#eaf0fb; }
  [data-theme="dark"] input::placeholder{ color:rgba(234,240,251,0.4); }
  [data-theme="dark"] ::-webkit-calendar-picker-indicator{ filter:invert(1); }
  [data-theme="dark"] .card:hover{ border-color:rgba(255,255,255,0.28); }
  [data-theme="dark"] button.ghost,[data-theme="dark"] .weekday-btn,[data-theme="dark"] .toggle-btn{ background:rgba(255,255,255,0.07); color:var(--text); }
  [data-theme="dark"] .clock-chip{ color:var(--accent-2); }
  .acct-btn{ display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; margin-bottom:6px; border-radius:16px; border:1px solid var(--border); background:var(--glass-b); color:var(--text); cursor:pointer; text-align:left; font-size:13px; }
  .acct-av{ width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
  .acct-t{ min-width:0; } .acct-t b{ display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .acct-t span{ font-size:11.5px; color:var(--text-secondary); }
  .auth-box{ max-width:360px !important; } .auth-err{ color:var(--red); font-size:12.5px; min-height:18px; margin-top:6px; }

<script>

const NAV_ITEMS = [

/* ============ STATE ============ */
const STORAGE_KEY = "daily_planner_data_v3";
const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SUBJECT_COLORS = ['#4F46E5','#16A34A','#D97706','#DC2626','#0891B2','#9333EA','#DB2777','#65A30D'];
const dateKey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayKey = () => dateKey(new Date());
function fmt12(t){ if(!t||String(t).indexOf(':')<0) return t||''; let [h,m]=String(t).split(':').map(Number); const ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+String(m).padStart(2,'0')+' '+ap; }
const esc = v => String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
let currentDayKey = todayKey();
let soundOn = true;

let data = { dates:{}, courses:[], todos:{icpc:[],uni:[],personal:[]}, settings:{studyGoal:3, cpGoal:3}, cgpaEntries:[] };
let pomodoroState = { running:false, mode:'work', secondsLeft:25*60, totalSeconds:25*60, timerId:null, ambient:'none', ambientNodes:null, endAt:null, volume:0.2 };

function emptyDay(){
  return {
    cp:{count:0, topics:{dp:false,graph:false,math:false,greedy:false,string:false}, note:""},
    namaz:{fajr:{fard:false,sunnah:false}, zuhr:{fard:false,sunnah:false}, asr:{fard:false,sunnah:false}, magrib:{fard:false,sunnah:false}, esha:{fard:false,sunnah:false}, nafl:false},
    azkar:{morning:false, evening:false},
    surah:{done:false, note:""},
    study:{sessions:[]},
    pomodoro:{completed:0},
    tasbeeh:{count:0, target:33}
  };
}
function migrateDay(d){
  if(!d.study) d.study = {sessions:[]};
  if(!d.pomodoro) d.pomodoro = {completed:0};
  if(!d.tasbeeh) d.tasbeeh = {count:0, target:33};
  if(d.cp.problems){
    d.cp.count = (d.cp.problems||[]).length;
    delete d.cp.problems;
  }
  if(d.cp.count==null) d.cp.count = 0;
  if(typeof d.namaz.fajr === 'boolean'){
    const old = d.namaz;
    d.namaz = {};
    ['fajr','zuhr','asr','magrib','esha'].forEach(w=> d.namaz[w] = {fard: !!old[w], sunnah:false});
    d.namaz.nafl = false;
  }
  if(d.namaz.nafl === undefined) d.namaz.nafl = false;
  return d;
}
function getDay(key){
  if(!data.dates[key]) data.dates[key] = emptyDay();
  data.dates[key] = migrateDay(data.dates[key]);
  return data.dates[key];
}
function dayHours(day){ return day.study.sessions.reduce((s,x)=>s+Number(x.hours||0),0); }
function cpCount(day){ return day.cp.count||0; }
function namazDoneCount(day){ return Object.keys(day.namaz).filter(k=>k!=='nafl').filter(w=>day.namaz[w].fard).length; }

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      data = JSON.parse(raw);
      if(!data.courses) data.courses=[];
      if(!data.todos) data.todos={icpc:[],uni:[],personal:[]};
      if(!data.todos.personal) data.todos.personal=[];
      if(!data.settings) data.settings={studyGoal:3,cpGoal:3};
      if(!data.cgpaEntries) data.cgpaEntries=[];
      data.courses.forEach(migrateCourse);
    }
    const theme = localStorage.getItem('planner_theme') || 'light';
    document.body.setAttribute('data-theme', theme); document.documentElement.setAttribute('data-theme', theme);
    soundOn = localStorage.getItem('planner_sound') !== 'off';
  }catch(e){}
}
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){} }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ============ CONFIRM MODAL ============ */
function confirmAction(message, onConfirm){
  const overlay = document.getElementById('confirm-modal-overlay');
  document.getElementById('confirm-modal-msg').textContent = message;
  overlay.style.display = 'flex';

  cancelBtn.onclick = close;
}
function subjectColor(subj){
  if(!subj) return '#9ca3af';
  let h=0; for(let i=0;i<subj.length;i++) h = subj.charCodeAt(i)+((h<<5)-h);
  return SUBJECT_COLORS[Math.abs(h)%SUBJECT_COLORS.length];
}

/* ============ SOUND ============ */
let audioCtx;
function ctx(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function beep(freq=880, dur=0.12, type='sine', vol=0.15){
  if(!soundOn) return;
  try{
    const c = ctx(); const o = c.createOscillator(); const g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  }catch(e){}
}
function playDone(){ beep(660,0.1); setTimeout(()=>beep(880,0.18),100); }
function playTick(){ beep(520,0.05,'square',0.06); }

let ambientNodes = null;
function stopAmbient(){
  if(!ambientNodes) return;
  const n = ambientNodes; ambientNodes = null;
  try{ n.gain.gain.setTargetAtTime(0, n.ctx.currentTime, 0.05); }catch(e){}
  setTimeout(()=>{ n.nodes.forEach(x=>{ try{ x.stop&&x.stop(); }catch(e){} try{ x.disconnect(); }catch(e){} }); },250);
}
// Stereo noise buffer with a cross-faded loop seam, so it loops without any audible click or pulse.
function makeNoise(c, kind, secs){
  const sr=c.sampleRate, N=Math.floor(secs*sr), F=Math.floor(0.6*sr);
  const buf=c.createBuffer(2,N,sr);
  for(let ch=0; ch<2; ch++){
    const raw=new Float32Array(N+F);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
    for(let i=0;i<N+F;i++){
      const w=Math.random()*2-1;
      if(kind==='brown'){ last=(last+0.02*w)/1.02; raw[i]=last*3.5; }
      else if(kind==='white'){ raw[i]=w*0.5; }
      else { // pink
        b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.96900*b2+w*0.1538520;
        b3=0.86650*b3+w*0.3104856; b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
        raw[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926;
      }
    }
    const out=buf.getChannelData(ch);
    for(let i=0;i<N;i++){
      if(i<F){ const t=i/F; out[i]=raw[i]*Math.sqrt(t)+raw[N+i]*Math.sqrt(1-t); } else out[i]=raw[i];
    }
  }
  return buf;
}
// Sparse random droplet "ticks" – this is what makes it sound like rain instead of just hiss.
function makeDrops(c, secs, perSec){
  const sr=c.sampleRate, N=Math.floor(secs*sr);
  const buf=c.createBuffer(2,N,sr);
  for(let ch=0; ch<2; ch++){
    const out=buf.getChannelData(ch);
    const len=Math.floor(0.02*sr);
    for(let i=0;i<N;i++){
      if(Math.random()<perSec/sr){
        const amp=0.25+Math.random()*0.75, tau=(0.0015+Math.random()*0.003)*sr;
        for(let k=0;k<len;k++){ out[(i+k)%N]+=amp*(Math.random()*2-1)*Math.exp(-k/tau); }
      }
    }
  }
  return buf;
}
function startAmbient(kind, volume){
  stopAmbient();
  if(kind==='none') return;
  const c = ctx();
  if(c.state==='suspended') c.resume();
  const master = c.createGain(); master.gain.value = 0;
  master.connect(c.destination);
  const nodes=[master];
  const add=(buf,filters,level)=>{
    const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
    let node=src;
    filters.forEach(f=>{ const bq=c.createBiquadFilter(); bq.type=f[0]; bq.frequency.value=f[1]; if(f[2]) bq.Q.value=f[2]; node.connect(bq); node=bq; nodes.push(bq); });
    const g=c.createGain(); g.gain.value=level; node.connect(g); g.connect(master);
    src.start(); nodes.push(src,g);
  };
  if(kind==='rain'){
    add(makeNoise(c,'pink',8), [['highpass',350],['lowpass',7500]], 1.0);   // soft steady shower bed
    add(makeDrops(c,9,110),    [['bandpass',3200,0.7]],               0.9);   // droplets
    add(makeNoise(c,'brown',8),[['lowpass',250]],                     0.35);  // distant low rumble
  } else if(kind==='white'){
    add(makeNoise(c,'white',6), [['highpass',60],['lowpass',9000]], 0.6);
  } else if(kind==='lofi'){
    add(makeNoise(c,'brown',8), [['lowpass',700]], 0.9);
    [110,165].forEach((f,i)=>{ const o=c.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=c.createGain(); g.gain.value=i?0.012:0.02; o.connect(g); g.connect(master); o.start(); nodes.push(o,g); });
  }
  master.gain.setTargetAtTime(volume, c.currentTime, 0.15);
  ambientNodes = { ctx:c, gain:master, nodes };
}

document.getElementById('import-input').onchange = (e)=>{
  const file = e.target.files[0]; if(!file) return;

      else alert('Invalid backup file.');
    }catch(err){ alert('Could not read file.'); }
  };
  reader.readAsText(file);
};

/* ============ STREAKS ============ */
function streak(field){
  let s=0, d=new Date();
  while(true){
    const key = dateKey(d);
    const day = data.dates[key];
    let ok=false;
    if(field==='cp') ok = day && cpCount(day)>0;
    if(field==='namaz') ok = day && namazDoneCount(day)===5;
    if(field==='azkar') ok = day && day.azkar.morning && day.azkar.evening;
    if(field==='surah') ok = day && day.surah.done;
    if(field==='study') ok = day && dayHours(day)>0;
    if(!ok) break;
    s++; d.setDate(d.getDate()-1);
  }
  return s;
}

/* ============ PROGRESS RING ============ */
function ring(pct, color, size=64, stroke=7){
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  const off = c - (Math.min(pct,100)/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="53%" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">${Math.round(pct)}%</text>
  </svg>`;
}

/* ---- Assignment / deadline warning ---- */
function upcomingDueItems(){
  const all = [...data.todos.icpc.map(t=>({...t,cat:'ICPC'})), ...data.todos.uni.map(t=>({...t,cat:'Uni'})), ...data.todos.personal.map(t=>({...t,cat:'Personal'}))];
  const today = new Date(); today.setHours(0,0,0,0);
  return all.filter(t=>!t.done && t.due).map(t=>{
    const d = new Date(t.due+'T00:00:00');
    const daysLeft = Math.round((d-today)/86400000);
    return {...t, daysLeft};
  }).filter(t=>t.daysLeft>=0 && t.daysLeft<=2).sort((a,b)=>a.daysLeft-b.daysLeft);
}
function upcomingExams(){
  const today = new Date(); today.setHours(0,0,0,0);
  const items = [];
  data.courses.forEach(c=>{
    (c.components||[]).forEach(comp=>{
      if(!comp.date) return;
      const d = new Date(comp.date+'T00:00:00');
      const daysLeft = Math.round((d-today)/86400000);
      if(daysLeft>=0 && daysLeft<=3) items.push({course:c.name, name:comp.name, date:comp.date, daysLeft});
    });
  });
  return items.sort((a,b)=>a.daysLeft-b.daysLeft);
}

// Only touches the timer text + ring on each tick, instead of rebuilding the whole
// section — this also avoids the volume slider / buttons losing their state every second.
function updatePomodoroDisplay(){
  const timeEl = document.getElementById('pomo-time');
  const ringEl = document.getElementById('pomo-ring');
  if(!timeEl || !ringEl) return;
  timeEl.textContent = fmtTime(pomodoroState.secondsLeft);
  const pct = 100 - (pomodoroState.secondsLeft/pomodoroState.totalSeconds*100);
  ringEl.innerHTML = ring(pct, pomodoroState.mode==='work'?'var(--accent)':'var(--green)', 190, 12);
}
function setPomoMode(mode, seconds){ pausePomodoro(); pomodoroState.mode=mode; pomodoroState.secondsLeft=seconds; pomodoroState.totalSeconds=seconds; renderPomodoro(); }
function togglePomodoro(){ pomodoroState.running ? pausePomodoro() : startPomodoro(); }
function startPomodoro(){
  if(pomodoroState.secondsLeft<=0) return;
  pomodoroState.running = true;
  // Anchor to a real wall-clock end time instead of just decrementing a counter every
  // setInterval tick — setInterval drifts and browsers throttle timers on background
  // tabs, so a naive counter falls behind. Recomputing from Date.now() keeps it accurate.
  pomodoroState.endAt = Date.now() + pomodoroState.secondsLeft*1000;
  pomodoroState.timerId = setInterval(tickPomodoro, 250);
  renderPomodoro();
}
function tickPomodoro(){
  const remaining = Math.round((pomodoroState.endAt - Date.now())/1000);
  const clamped = Math.max(0, remaining);
  if(clamped === pomodoroState.secondsLeft) return;
  pomodoroState.secondsLeft = clamped;
  if(clamped<=0){ pausePomodoro(); finishPomodoro(); return; }
  updatePomodoroDisplay();
}
function finishPomodoro(){
  playDone();
  if(pomodoroState.mode==='work'){
    const day = getDay(currentDayKey);
    day.pomodoro.completed += 1;
    day.study.sessions.push({subject:'Pomodoro focus', hours: +(pomodoroState.totalSeconds/3600).toFixed(2)});
    save();
    notify('Pomodoro done! 🎉','Session complete — great focus. Time for a break.');
  } else {
    notify('Break over','Ready for the next focus session?');
  }
  renderPomodoro();
}
function pausePomodoro(){
  if(pomodoroState.running && pomodoroState.endAt){
    // Lock in the true remaining time (not the last polled value) so resuming is accurate.
    pomodoroState.secondsLeft = Math.max(0, Math.round((pomodoroState.endAt - Date.now())/1000));
  }
  pomodoroState.running=false;
  if(pomodoroState.timerId) clearInterval(pomodoroState.timerId);
  pomodoroState.timerId=null;
  pomodoroState.endAt=null;
}
function resetPomodoro(){ pausePomodoro(); const defaults={work:25*60,short:5*60,long:15*60}; pomodoroState.secondsLeft=defaults[pomodoroState.mode]; pomodoroState.totalSeconds=pomodoroState.secondsLeft; renderPomodoro(); }

/* ============ COURSES ============ */
function timeToMinutes(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function nextClassCountdown(){
  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes();
  const wdIdx = now.getDay();
  let best = null;
  for(let offset=0; offset<7; offset++){
    const wd = WEEKDAYS[(wdIdx+offset)%7];
    data.courses.forEach(c=>{
      (c.slots||[]).forEach(s=>{
        if(s.day!==wd) return;
        const slotMin = timeToMinutes(s.time);
        if(offset===0 && slotMin<=nowMin) return;
        const totalMinAway = offset*1440 + (slotMin-nowMin);
        if(best===null || totalMinAway<best.min) best = {min:totalMinAway, name:c.name, day:wd, time:s.time};
      });
    });
    if(best) break;
  }
  return best;
}

// Independent University Bangladesh (IUB) official grading scale.
const GRADE_SCALE = [
  {min:90,letter:'A',point:4.0},{min:85,letter:'A-',point:3.7},{min:80,letter:'B+',point:3.3},
  {min:75,letter:'B',point:3.0},{min:70,letter:'B-',point:2.7},{min:65,letter:'C+',point:2.3},
  {min:60,letter:'C',point:2.0},{min:55,letter:'C-',point:1.7},{min:50,letter:'D+',point:1.3},
  {min:45,letter:'D',point:1.0},{min:0,letter:'F',point:0.0}
];
function gradeFromPct(pct){ return GRADE_SCALE.find(g=>pct>=g.min) || GRADE_SCALE[GRADE_SCALE.length-1]; }
function migrateCourse(c){
  if(!c.components){
    c.components = [];
    const w = c.weights || {ct:30,mid:30,final:40};
    ['ct1','ct2','ct3'].forEach(k=>{ if(c[k]) c.components.push({id:uid(), name:k.toUpperCase(), marks:c[k].marks||'', total:c[k].total||'', weight:(w.ct||30)/3}); });
    if(c.mid) c.components.push({id:uid(), name:'Mid', marks:c.mid.marks||'', total:c.mid.total||'', weight:w.mid||30});
    if(c.final) c.components.push({id:uid(), name:'Final', marks:c.final.marks||'', total:c.final.total||'', weight:w.final||40});
  }
  if(c.creditHours==null) c.creditHours = 3;
  return c;
}

function renderRoutineMatrix(){

  WEEKDAYS.forEach(d=>byDay[d].sort((a,b)=>a.time.localeCompare(b.time)));
  const maxRows = Math.max(1, ...WEEKDAYS.map(d=>byDay[d].length));
  let rows = '';
  for(let r=0;r<maxRows;r++){
    rows += `<tr>${WEEKDAYS.map(d=>{

      <tr>${WEEKDAYS.map(d=>`<th>${d}</th>`).join('')}</tr>

}

  `).join('') || '<p class="hint" style="margin:0 0 6px;">No components yet — add one below.</p>';

function computeGradeStatus(c){
  const target = c.targetGrade!=null && c.targetGrade!=='' ? Number(c.targetGrade) : 80;
  const comps = c.components||[];
  let achieved = 0; const missing = [];
  comps.forEach(comp=>{
    const w = Number(comp.weight)||0;
    const filled = comp.marks!=='' && comp.marks!=null && comp.total!=='' && comp.total!=null && Number(comp.total)>0;
    if(filled) achieved += (Number(comp.marks)/Number(comp.total))*w;
    else missing.push(comp.name);
  });
  let message, tone='amber';
  if(missing.length===0){
    tone = achieved>=target ? 'green' : 'red';
    message = achieved>=target ? `Target reached — total ${achieved.toFixed(1)}%.` : `Total so far ${achieved.toFixed(1)}% — below your ${target}% target.`;
  } else if(missing.length===1){
    const comp = comps.find(x=>x.name===missing[0]);
    const weight = comp ? Number(comp.weight)||0 : 0;
    if(!weight){ message = `Set a weight % for ${missing[0]} first.`; }
    else {
      const neededPct = (target-achieved)/weight*100;
      if(neededPct<=0){ tone='green'; message = `Target already secured — even 0% in ${missing[0]} still hits ${target}%.`; }
      else if(neededPct>100){ tone='red'; message = `Not possible to reach ${target}% now — would need ${neededPct.toFixed(1)}% in ${missing[0]}.`; }
      else {
        tone = neededPct>75 ? 'red' : neededPct>50 ? 'amber' : 'green';
        const totalField = comp && comp.total;
        message = `Need ${neededPct.toFixed(1)}%${totalField ? ` (≈ ${(neededPct/100*Number(totalField)).toFixed(1)}/${totalField})` : ''} in ${missing[0]} to reach ${target}% overall.`;
      }
    }
  } else {
    message = `Fill in ${missing.join(' & ')} marks to see what's needed.`;
  }
  return {achieved, target, missing, message, tone};
}
function renderGradeResult(c){
  const s = computeGradeStatus(c);
  const g = gradeFromPct(s.achieved);
  return `<div class="hint" style="margin:8px 0 4px;">Achieved so far: <strong style="color:var(--text);">${s.achieved.toFixed(1)}%</strong> / ${s.target}% target ${s.missing.length===0?`• est. grade <strong>${g.letter}</strong> (${g.point.toFixed(2)})`:''}</div>
    <div class="grade-msg grade-msg-${s.tone}">${s.message}</div>`;
}

function enableDragReorder(container){
  let dragEl = null;
  container.querySelectorAll('.todo-item').forEach(item=>{
    item.addEventListener('dragstart', ()=>{ dragEl=item; item.style.opacity='0.4'; });
    item.addEventListener('dragend', ()=>{ item.style.opacity='1'; persistOrder(container); });
    item.addEventListener('dragover', (e)=>{
      e.preventDefault();
      const after = getDragAfter(container, e.clientY);
      if(after==null) container.appendChild(dragEl); else container.insertBefore(dragEl, after);
    });
  });
}
function getDragAfter(container, y){
  const items = [...container.querySelectorAll('.todo-item:not([style*="opacity: 0.4"])')];
  return items.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height/2;
    if(offset<0 && offset>closest.offset) return {offset, element:child};
    return closest;
  }, {offset:-Infinity}).element;
}
function persistOrder(container){
  const ids = [...container.querySelectorAll('.todo-item')].map(x=>x.dataset.id);
  data.todos[todoActiveCat] = ids.map(id=> data.todos[todoActiveCat].find(t=>t.id===id));
  save();
}
function toggleTodo(id){ const t=data.todos[todoActiveCat].find(x=>x.id===id); if(t){ t.done=!t.done; save(); playDone(); renderTodoList(); } }
function deleteTodo(id){ data.todos[todoActiveCat] = data.todos[todoActiveCat].filter(x=>x.id!==id); save(); renderTodoList(); }

/* ============ DEEN ============ */
const REMINDERS = [
  "Reminder: patience and prayer are described as sources of help in hardship (paraphrase, Al-Baqarah 2:153).",
  "Reminder: no soul is burdened beyond what it can bear (paraphrase, Al-Baqarah 2:286).",

];
function todaysReminder(){
  const idx = Math.floor(new Date().setHours(0,0,0,0)/86400000) % REMINDERS.length;

}

/* ============ STATS ============ */
let successChart;
function successScore(day){
  const namazScore = namazDoneCount(day)/5;
  const azkarScore = ((day.azkar.morning?1:0)+(day.azkar.evening?1:0))/2;
  const surahScore = day.surah.done?1:0;
  const cpScore = Math.min(cpCount(day)/(data.settings.cpGoal||3),1);
  const studyScore = Math.min(dayHours(day)/(data.settings.studyGoal||3),1);
  return Math.round(((namazScore+azkarScore+surahScore+cpScore+studyScore)/5)*100);
}
function badges(){
  const b=[];
  const cpS=streak('cp'), namazS=streak('namaz'), studyS=streak('study');
  if(cpS>=3) b.push('🔥 '+cpS+'-day CP streak');
  if(namazS>=7) b.push('🕌 '+namazS+'-day Namaz streak');
  if(studyS>=5) b.push('📚 '+studyS+'-day Study streak');
  if(cpS>=7) b.push('🏆 CP Warrior (7+)');
  if(namazS>=30) b.push('🌙 Consistency Champion (30+)');
  if(!b.length) b.push('Start a streak today!');
  return b;
}
function renderHeatmapSection(field, label, color, levelFn){
  const days = lastNDays(180);
  const cells = days.map(k=>{
    const d = data.dates[k];
    const level = d ? levelFn(d) : 0;
    const bg = level===0 ? 'var(--border)' : color;
    const op = level===0 ? 1 : (0.25+level*0.1875);
    return `<div class="heatmap-cell" style="background:${bg}; opacity:${op};" title="${k}"></div>`;
  }).join('');
  return `<div style="margin-bottom:10px;">
    <div class="hint" style="margin:0 0 4px;">${label}</div>
    <div class="heatmap-wrap"><div class="heatmap-grid">${cells}</div></div>
  </div>`;
}

      <div class="section-title">Achievements</div>

      ${renderHeatmapSection('namaz','Namaz','var(--green)',d=>namazDoneCount(d))}

        <div><label class="field-label">CP goal (problems/day)</label><input type="number" id="set-cp-goal" value="${data.settings.cpGoal||3}" min="1" /></div>
      </div>
      <button class="primary" id="save-settings" style="margin-top:10px;">Save goals</button>

      <div class="section-title">History (edit / delete)</div>
      <table>
        <tr><th>Date</th><th>Study</th><th>CP</th><th>Namaz</th><th>Azkar</th><th>Surah</th><th></th></tr>
        ${keys.length ? keys.slice().reverse().map(k=>{
          const d = data.dates[k];
          return `<tr>
            <td>${k}</td><td>${dayHours(d).toFixed(1)}h</td><td>${cpCount(d)}</td>
            <td>${namazDoneCount(d)}/5</td><td>${(d.azkar.morning?1:0)+(d.azkar.evening?1:0)}/2</td>
            <td>${d.surah.done?'✓':'-'}</td>
            <td><button class="danger-ghost" onclick="deleteDayEntry('${k}')">Delete</button></td>
          </tr>`;
        }).join('') : '<tr><td colspan="7" style="color:var(--text-secondary);">No entries yet</td></tr>'}
      </table>
    </div>
  `;
  document.getElementById('save-settings').onclick = ()=>{
    data.settings.studyGoal = parseFloat(document.getElementById('set-study-goal').value)||3;
    data.settings.cpGoal = parseInt(document.getElementById('set-cp-goal').value)||3;
    save(); renderAll(); switchTab('stats');
  };
  renderCgpaCalculator();
}
function deleteDayEntry(key){
  confirmAction('Delete all data for '+key+'? This cannot be undone.', ()=>{
    delete data.dates[key]; save(); renderStats(); setTimeout(renderSuccessChart,30);
  });
}
function renderSuccessChart(){
  if(typeof Chart==='undefined') return;
  Chart.defaults.color = chartTextColor(); Chart.defaults.borderColor = 'rgba(128,140,170,0.22)';
  const days = lastNDays(30);
  const scores = days.map(k=> data.dates[k] ? successScore(data.dates[k]) : 0);
  const labels = days.map(k=>k.slice(5));
  const ctx = document.getElementById('success-chart');
  if(!ctx) return;
  if(successChart) successChart.destroy();
  successChart = new Chart(ctx, {type:'line', data:{labels, datasets:[{label:'Success %', data:scores, borderColor:'#0FBFBF', backgroundColor:'rgba(15,191,191,0.15)', fill:true, tension:0.3}]}, options:{responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, max:100}}}});
}

/* ============ CLOCK / MIDNIGHT ============ */
function updateClock(){
  const now = new Date();
  document.getElementById('live-clock').textContent = now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});
  const nowKey = todayKey();
  if(nowKey !== currentDayKey){ currentDayKey = nowKey; renderAll(); }
}
function renderAll(){
  renderToday(); renderStudy(); renderPomodoro(); renderCourses(); renderTodo(); renderDeen(); renderStats();
}

load();
renderAll();
switchTab('today');
document.getElementById('sound-toggle').style.opacity = soundOn?'1':'0.4';
updateClock();
setInterval(updateClock, 1000);
</script>

<div class="modal-overlay" id="auth-overlay" style="display:none;">
  <div class="modal-box auth-box" id="auth-box"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
/* ============ CLOUD SYNC (Firebase) ============
   Paste your Firebase web-app config here (Firebase console -> Project settings -> Your apps). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDzSA5Yu4L7Nt0tv5Zs7LYElC7TF1-G5qs",
  authDomain: "daily-planner-bymubin.firebaseapp.com",
  projectId: "daily-planner-bymubin"
};
(function(){
  const configured = !/^PASTE/.test(FIREBASE_CONFIG.apiKey) && typeof firebase!=='undefined';
  const TS_KEY='daily_planner_updated_at';
  const $=id=>document.getElementById(id);
  const getTs=()=>Number(localStorage.getItem(TS_KEY)||0);
  const setTs=t=>localStorage.setItem(TS_KEY,String(t));
  let user=null, docRef=null, unsub=null, timer=null, applying=false, status='Sync off';
  function setStatus(t){ status=t; const e=$('acct-status'); if(e) e.textContent=t; }
  function paintAcct(){
    $('acct-av').textContent = user ? (user.email||'?')[0].toUpperCase() : '?';
    $('acct-name').textContent = user ? (user.displayName||user.email) : 'Sign in';
    setStatus(!configured ? 'Sync not set up' : user ? status : 'Sync off');
  }
  const origSave = save;
  save = function(){ origSave(); if(applying) return; setTs(Date.now()); schedulePush(); };
  function schedulePush(){ if(!user) return; setStatus('Syncing…'); clearTimeout(timer); timer=setTimeout(push,1200); }
  function push(){
    if(!user||!docRef) return;
    if(!getTs()) setTs(Date.now());
    docRef.set({json:JSON.stringify(data), updatedAt:getTs()})
      .then(()=>setStatus('Synced')).catch(()=>setStatus('Offline – will retry'));
  }
  function applyRemote(r){
    try{ localStorage.setItem('planner_backup_before_sync', localStorage.getItem(STORAGE_KEY)||''); }catch(e){}
    let inc; try{ inc=JSON.parse(r.json); }catch(e){ return; }
    inc.dates=inc.dates||{}; inc.courses=inc.courses||[]; inc.todos=inc.todos||{icpc:[],uni:[],personal:[]};
    if(!inc.todos.personal) inc.todos.personal=[]; inc.settings=inc.settings||{studyGoal:3,cpGoal:3}; inc.cgpaEntries=inc.cgpaEntries||[];
    inc.courses.forEach(migrateCourse);
    applying=true; data=inc; save(); setTs(r.updatedAt); applying=false;
    renderAll();
    if(typeof renderStudyCharts==='function') setTimeout(renderStudyCharts,30);
    if(typeof renderSuccessChart==='function') setTimeout(renderSuccessChart,30);
  }
  function listen(){
    if(unsub) unsub();
    setStatus('Syncing…');
    unsub=docRef.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites) return;
      if(!snap.exists){ push(); return; }
      const r=snap.data(), lt=getTs();
      if(r.updatedAt>lt){ applyRemote(r); setStatus('Synced'); }
      else if(lt>r.updatedAt){ push(); }
      else setStatus('Synced');
    }, ()=>setStatus('Sync error'));
  }
  window.addEventListener('online',()=>{ if(user) push(); });

  /* ---- auth modal ---- */
  const ov=$('auth-overlay'), box=$('auth-box');
  const open=()=>{ render(); ov.style.display='flex'; }, close=()=>{ ov.style.display='none'; };
  ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  $('acct-btn').onclick=open;
  function render(){
    if(!configured){
      box.innerHTML='<div class="section-title">Sync is not set up yet</div><div class="hint">Paste your Firebase config into <b>FIREBASE_CONFIG</b> inside index.html, then reload. The planner keeps working on this device meanwhile.</div><div class="modal-actions" style="margin-top:14px;"><button class="ghost" id="a-close">Close</button></div>';
      $('a-close').onclick=close; return;
    }
    if(user){
      box.innerHTML='<div class="section-title">Account</div><div style="font-size:13.5px;">'+esc(user.email||'')+'</div><div class="hint">Status: '+esc(status)+'</div><div class="modal-actions" style="margin-top:14px;"><button class="ghost" id="a-sync">Sync now</button><button class="ghost" id="a-out">Sign out</button><button class="primary" id="a-close">Close</button></div>';
      $('a-close').onclick=close; $('a-sync').onclick=()=>{ if(!getTs()) setTs(Date.now()); push(); close(); };
      $('a-out').onclick=()=>{ firebase.auth().signOut(); close(); };
      return;
    }
    box.innerHTML='<div class="section-title">Sign in to sync</div>'
      +'<button class="primary" id="a-google" style="width:100%;">Continue with Google</button>'
      +'<div class="auth-or">or use email</div>'
      +'<input type="text" id="a-email" placeholder="Email" autocomplete="email" />'
      +'<input type="text" id="a-pass" placeholder="Password (6+ characters)" autocomplete="current-password" style="-webkit-text-security:disc;" />'
      +'<div class="auth-err" id="a-err"></div>'
      +'<div class="modal-actions"><button class="ghost" id="a-close">Cancel</button><button class="ghost" id="a-new">Create account</button><button class="primary" id="a-in">Sign in</button></div>';
    const err=m=>{ $('a-err').textContent=m; };
    const run=p=>p.then(close).catch(e=>err(e.code==='auth/popup-closed-by-user'?'':(e.message||'Something went wrong').replace('Firebase: ','')));
    $('a-close').onclick=close;
    $('a-google').onclick=()=>{ const prov=new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(prov).then(close).catch(e=>{
        if(e.code==='auth/popup-blocked') firebase.auth().signInWithRedirect(prov);
        else if(e.code!=='auth/popup-closed-by-user') err((e.message||'').replace('Firebase: ',''));
      }); };
    $('a-in').onclick=()=>run(firebase.auth().signInWithEmailAndPassword($('a-email').value.trim(),$('a-pass').value));
    $('a-new').onclick=()=>run(firebase.auth().createUserWithEmailAndPassword($('a-email').value.trim(),$('a-pass').value));
  }

  if(configured){
    firebase.initializeApp(FIREBASE_CONFIG);
    const db=firebase.firestore();
    firebase.auth().onAuthStateChanged(u=>{
      user=u;
      if(u){ docRef=db.collection('users').doc(u.uid).collection('planner').doc('main'); listen(); }
      else { if(unsub){ unsub(); unsub=null; } docRef=null; setStatus('Sync off'); }
      paintAcct();
      if(ov.style.display==='flex') render();
    });
  }
  paintAcct();
})();

if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){

/* close the side menu when tapping anywhere outside it */
(function(){
  const sb = document.getElementById('sidebar');
  document.addEventListener('click', e=>{
    if(!sb.classList.contains('open')) return;
    if(sb.contains(e.target)) return;
    if(e.target.closest('#tb-more, #hamburger')) return;
    sb.classList.remove('open');

})();
/* lock the page: no pinch-zoom and no sideways drifting on touch devices */
(function(){
  const stop = e => e.preventDefault();
  ['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n, stop, {passive:false}));
  document.addEventListener('touchmove', e=>{ if(e.touches && e.touches.length>1) e.preventDefault(); }, {passive:false});
  let lastTap=0;
  document.addEventListener('touchend', e=>{ const t=Date.now(); if(t-lastTap<300) e.preventDefault(); lastTap=t; }, {passive:false});
  const snapBack = ()=>{ if(window.scrollX!==0) window.scrollTo(0, window.scrollY); };
  window.addEventListener('scroll', snapBack, {passive:true});
  if(window.visualViewport){ window.visualViewport.addEventListener('scroll', snapBack); }
})();
/* keep the floating tab bar fixed in size when the page is pinch-zoomed */
(function(){
  const vv=window.visualViewport, tb=document.getElementById('tabbar'); if(!vv||!tb) return;
  let raf=0;
  function fix(){
    raf=0; const sc=vv.scale;
    if(sc<=1.01){ tb.style.transform=''; return; }
    const H=document.documentElement.clientHeight, k=1/sc;
    const dx=vv.offsetLeft+12*k-12, dy=vv.offsetTop+vv.height-12*k-(H-12);
    tb.style.transform='translate('+dx+'px,'+dy+'px) scale('+k+')';
  }
  const queue=()=>{ if(!raf) raf=requestAnimationFrame(fix); };
  vv.addEventListener('resize',queue); vv.addEventListener('scroll',queue);
})();
</script>
